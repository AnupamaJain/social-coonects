name: Scheduler

# Drives Sixfold's two cron endpoints, because Vercel's Hobby plan caps cron at
# one run per day.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ THIS WORKFLOW IS DISABLED BY DEFAULT.                                   │
# │                                                                         │
# │ Enable it only after both repository secrets exist, or nothing will     │
# │ publish. Settings → Secrets and variables → Actions:                    │
# │                                                                         │
# │   APP_URL      https://your-app.vercel.app                              │
# │   CRON_SECRET  the same value set on the Vercel project                 │
# │                                                                         │
# │ Then: gh workflow enable scheduler.yml   (or the Actions tab)           │
# └─────────────────────────────────────────────────────────────────────────┘
#
# If the secrets are missing it exits cleanly with a notice rather than
# failing. A scheduler that can't reach anything is misconfigured, not broken,
# and a red X every five minutes teaches you to ignore the ones that matter.

on:
  schedule:
    - cron: "*/5 * * * *"   # publish due posts
    - cron: "0 */6 * * *"   # refresh metrics, retrain predictors
  workflow_dispatch:
    inputs:
      job:
        description: Which endpoint to run
        type: choice
        options: [publish, metrics, both]
        default: both

# A slow run must never let the next tick pile up behind it.
concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration
        id: cfg
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          [ -z "$APP_URL" ] && missing="$missing APP_URL"
          [ -z "$CRON_SECRET" ] && missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::notice title=Scheduler skipped::Missing repository secret(s):$missing — see the header of .github/workflows/scheduler.yml"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish due posts
        if: >-
          steps.cfg.outputs.ready == 'true' &&
          (github.event.schedule == '*/5 * * * *' || inputs.job == 'publish' || inputs.job == 'both')
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 120 -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/publish") || {
              echo "::error title=Publish unreachable::curl failed against $APP_URL"; exit 1; }
          cat /tmp/out.json
          if [ "$code" != "200" ]; then
            echo "::error title=Publish failed::HTTP $code — a 401 means CRON_SECRET does not match the Vercel project"
            exit 1
          fi

      - name: Refresh metrics and retrain predictors
        if: >-
          steps.cfg.outputs.ready == 'true' &&
          (github.event.schedule == '0 */6 * * *' || inputs.job == 'metrics' || inputs.job == 'both')
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 120 -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/metrics") || {
              echo "::error title=Metrics unreachable::curl failed against $APP_URL"; exit 1; }
          cat /tmp/out.json
          if [ "$code" != "200" ]; then
            echo "::error title=Metrics failed::HTTP $code"
            exit 1
          fi
